name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Extension manifest matches the build version
        run: python3 scripts/check_manifest.py

      - name: Stable versions have release notes in CHANGELOG.md
        run: |
          version=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          case "$version" in
            *-*) echo "pre-release $version; no changelog section required" ;;
            *)   python3 scripts/release_notes.py --check "$version" ;;
          esac

      - name: Unit tests
        # settings.gradle.kts falls back to USERNAME/TOKEN for the Karoo SDK
        # GitHub Packages repository. GITHUB_TOKEN can read public packages.
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: radarcount-karoo-debug
          path: app/build/outputs/apk/debug/*.apk
