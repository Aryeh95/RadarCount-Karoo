name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.1.0-test1)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Decode signing keystore
        # Add repository secrets SIGNING_KEYSTORE_B64 and SIGNING_STORE_PASSWORD
        # so every release is signed with the same key and installs as an
        # update. Without them the build falls back to a throwaway debug key.
        if: ${{ secrets.SIGNING_KEYSTORE_B64 != '' }}
        run: echo "${{ secrets.SIGNING_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GPR_KEY || secrets.GITHUB_TOKEN }}
          SIGNING_KEYSTORE_PATH: ${{ secrets.SIGNING_KEYSTORE_B64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: radarcount
        run: ./gradlew --no-daemon assembleRelease

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
